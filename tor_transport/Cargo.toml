[package]
name = "tor_transport"
version = "0.1.0"
edition = "2021"
description = "Privilege-separated ephemeral Tor v3 transport bridge for ST2027 (Arti + EphemeralKeystore + Restricted Discovery)"
license = "MIT"

[[bin]]
name = "secure-transmit-tor"
path = "src/main.rs"

[dependencies]
# Embedded pure-Rust Tor implementation (`arti-client 0.48.0`, MSRV 1.92).
# Excluded: `hs-pow-full` (pulls `equix`/`hashx` LGPL-3.0-only + `dynasmrt` JIT).
# Uses OS-native TLS (`native-tls`: Windows SChannel / Linux OpenSSL) and
# `static-sqlite` so zero external runtime binaries are required.
arti-client = { version = "0.48.0", default-features = false, features = [
    "tokio",
    "native-tls",
    "static-sqlite",
    "onion-service-client",
    "onion-service-service",
    "vanguards",
    "ephemeral-keystore",
    "restricted-discovery",
    "pt-client",
    "experimental-api",
] }
futures = "0.3"
getrandom = "0.4"
safelog = "0.10"
tempfile = "3"
tokio = { version = "1.53.1", features = ["full"] }
tor-cell = "0.48.0"
tor-config = "0.48.0"
tor-guardmgr = "0.48.0"
tor-hsservice = { version = "0.48.0", features = ["restricted-discovery", "experimental-api"] }
tor-hscrypto = "0.48.0"
tor-keymgr = { version = "0.48.0", features = ["ephemeral-keystore", "experimental-api"] }
tor-llcrypto = "0.48.0"
tor-persist = "0.48.0"
tor-proto = "0.48.0"
tor-rtcompat = { version = "0.48.0", default-features = false, features = ["tokio", "native-tls"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
