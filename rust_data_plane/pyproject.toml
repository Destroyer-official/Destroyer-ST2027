[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "destroyer-core"
version = "0.1.0"
description = "Rust data plane for sovereign direct-IPv6 P2P (isolated crate, tested before integration)"
requires-python = ">=3.10"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
module-name = "destroyer_core._native"
python-source = "python"
