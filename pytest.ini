[pytest]
# Pytest configuration for secure_p2p_core tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for pytest-asyncio (uncomment if pytest-asyncio is installed)
# asyncio_mode = auto

# Markers for test categorization
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests as network-related
    handshake: marks tests as handshake-related

# Coverage options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    -ra
    -s
    -p no:hypothesispytest
    -p no:pytest-qt
    --import-mode=importlib

# Minimum Python version
minversion = 3.8

# Root pythonpath for importlib mode
pythonpath = .

# Test paths
testpaths = tests .

# 2026-09-18 production-grade: bare `pytest` must work on a fresh clone.
# Exclude archived/superseded snapshots (mirrors the Bandit exclude list in
# defense_ci.yml) and the legacy secure_p2p_core test snapshot whose imports
# target a superseded package API (see audit report; live code paths are
# covered by the root suites instead). Use importlib mode so the
# NOTE: same-basename suites (root test_*.py vs tests/test_*.py mirrors)
# coexist via --import-mode=importlib in addopts above.
norecursedirs =
    .* _build build dist node_modules venv .venv __pycache__
    notupload archive redesign downloads logs compliance_reports
    secure_p2p_core
    .hypothesis .pytest_cache .git

# Timeout for tests (in seconds)
timeout = 300
